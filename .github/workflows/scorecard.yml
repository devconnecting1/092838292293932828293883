name: Scorecard

# OpenSSF Scorecard: avalia as práticas de segurança do repositório (actions fixadas,
# permissões dos tokens, proteção de branch, dependências...). O resultado vai para
# Security > Code scanning (SARIF) e é publicado em api.scorecard.dev (badge).
# Grátis em repositório público. Modelo oficial:
# https://github.com/ossf/scorecard/blob/main/.github/workflows/scorecard-analysis.yml
# Com publish_results, a API do Scorecard exige: nada de env/defaults no topo, nenhuma
# permissão de escrita no topo e, no job, só checkout, upload-sarif e a própria action.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1" # segunda-feira, 04:41 em Brasília
  branch_protection_rule:

permissions: {}

jobs:
  analise:
    name: Análise do Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # ler o código
      security-events: write # enviar o SARIF para o code scanning
      id-token: write # token OIDC exigido por publish_results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
